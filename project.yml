name: QuickVars
options:
  bundleIdPrefix: com.serhansari
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  QuickVars:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: QuickVars
        excludes:
          - Info.plist
      - path: Shared
    entitlements:
      path: QuickVars/QuickVars.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.serhansari.QuickVars
    info:
      path: QuickVars/Info.plist
      properties:
        CFBundleDisplayName: QuickVars
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIImageName: LaunchIcon
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: "QuickVars uses Face ID to protect the details you save."
        NSMicrophoneUsageDescription: "QuickVars uses your microphone so you can ask for a saved detail by voice."
        NSSpeechRecognitionUsageDescription: "QuickVars transcribes your voice on-device to find what you asked for."
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - quickvars
            CFBundleURLName: com.serhansari.QuickVars
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serhansari.QuickVars
        PRODUCT_NAME: QuickVars
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: BA24C6W48D
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: QuickVarsWatch
        embed: true
      - target: QuickVarsWidgets
        embed: true

  QuickVarsWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: QuickVarsWatch
        excludes:
          - Info.plist
    info:
      path: QuickVarsWatch/Info.plist
      properties:
        CFBundleDisplayName: QuickVars
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.serhansari.QuickVars
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serhansari.QuickVars.watchkitapp
        PRODUCT_NAME: QuickVarsWatch
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: BA24C6W48D
        CODE_SIGN_STYLE: Automatic

  QuickVarsWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: QuickVarsWidgets
        excludes:
          - Info.plist
      - path: Shared
    entitlements:
      path: QuickVarsWidgets/QuickVarsWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.serhansari.QuickVars
    info:
      path: QuickVarsWidgets/Info.plist
      properties:
        CFBundleDisplayName: QuickVars
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serhansari.QuickVars.widgets
        PRODUCT_NAME: QuickVarsWidgets
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
        DEVELOPMENT_TEAM: BA24C6W48D
        CODE_SIGN_STYLE: Automatic

schemes:
  QuickVars:
    build:
      targets:
        QuickVars: all
    run:
      config: Debug
      storeKitConfiguration: QuickVars.storekit
    archive:
      config: Release
      revealArchiveInOrganizer: true
