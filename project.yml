name: LifeVars
options:
  bundleIdPrefix: com.serhansari
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  LifeVars:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LifeVars
        excludes:
          - Info.plist
      - path: Shared
    entitlements:
      path: LifeVars/LifeVars.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.serhansari.LifeVars
    info:
      path: LifeVars/Info.plist
      properties:
        CFBundleDisplayName: LifeVars
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIImageName: LaunchIcon
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: "LifeVars uses Face ID to protect the details you save."
        NSMicrophoneUsageDescription: "LifeVars uses your microphone so you can ask for a saved detail by voice."
        NSSpeechRecognitionUsageDescription: "LifeVars transcribes your voice on-device to find what you asked for."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - lifevars
            CFBundleURLName: com.serhansari.LifeVars
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serhansari.LifeVars
        PRODUCT_NAME: LifeVars
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: LifeVarsWatch
        embed: true
      - target: LifeVarsWidgets
        embed: true

  LifeVarsWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: LifeVarsWatch
        excludes:
          - Info.plist
    info:
      path: LifeVarsWatch/Info.plist
      properties:
        CFBundleDisplayName: LifeVars
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.serhansari.LifeVars
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serhansari.LifeVars.watchkitapp
        PRODUCT_NAME: LifeVars
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  LifeVarsWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LifeVarsWidgets
        excludes:
          - Info.plist
      - path: Shared
    entitlements:
      path: LifeVarsWidgets/LifeVarsWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.serhansari.LifeVars
    info:
      path: LifeVarsWidgets/Info.plist
      properties:
        CFBundleDisplayName: LifeVars
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serhansari.LifeVars.widgets
        PRODUCT_NAME: LifeVarsWidgets
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: NO

schemes:
  LifeVars:
    build:
      targets:
        LifeVars: all
    run:
      config: Debug
      storeKitConfiguration: LifeVars.storekit
